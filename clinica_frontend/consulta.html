<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultar / Cancelar Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="container mt-5">
    <div style="max-width: 800px">
      <h2 class="mb-4">Consultar / Cancelar Agendamento</h2>

      <a href="index.html" class="btn btn-secondary mb-3"> ← Voltar para página inicial </a>

      <div class="mb-3">
        <label for="cpf" class="form-label">Digite seu CPF para consulta</label>
        <input
          type="text"
          id="cpf"
          class="form-control"
          placeholder="Digite o CPF"
          maxlength="11"
          inputmode="numeric"
          autocomplete="off"
        />
      </div>

      <button type="button" id="btnConsultar" class="btn btn-primary mb-4">Consultar</button>

      <div id="resultado"></div>
    </div>

    <script src="js/consulta.js"></script>
  </body>
</html>
