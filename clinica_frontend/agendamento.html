<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcar Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="container mt-5">
    <div style="max-width: 600px">
      <h2 class="mb-4">Marcar Consulta</h2>

      <a href="index.html" class="btn btn-secondary mb-3"> ← Voltar para página inicial </a>

      <form id="formAgendamento" autocomplete="off">
        <div class="mb-3">
          <label for="medico" class="form-label">Médico</label>
          <input type="text" id="medico" name="medico" class="form-control" readonly />
        </div>

        <div class="mb-3">
          <label for="especialidade" class="form-label">Especialidade</label>
          <input type="text" id="especialidade" name="especialidade" class="form-control" readonly />
        </div>

        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Paciente</label>
          <input type="text" id="nome" name="nome" class="form-control" autocomplete="off" required />
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            class="form-control"
            maxlength="11"
            inputmode="numeric"
            autocomplete="off"
            required
          />
        </div>

        <div class="mb-3">
          <label for="data" class="form-label">Data</label>
          <select id="data" name="data" class="form-control" required>
            <option value="">Selecione uma data</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Agendar</button>
      </form>
    </div>

    <script src="js/agendamento.js"></script>
  </body>
</html>
